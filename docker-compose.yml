services:
  db:
    image: postgres:16-alpine
    container_name: giliranku-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: giliranku
      POSTGRES_PASSWORD: giliranku
      POSTGRES_DB: giliranku
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - giliranku-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giliranku -d giliranku"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  giliranku-pgdata:
